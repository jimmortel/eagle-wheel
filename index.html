<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TALON WHEEL 🎡</title>
    <script src="https://unpkg.com/@farcaster/frame-sdk/dist/index.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; overflow: hidden; }
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 20px auto; }
        #canvas { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .pointer { 
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent;
            border-right: 15px solid transparent; border-top: 30px solid #f59e0b; z-index: 10;
        }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-height-screen p-4">
    <h1 class="text-2xl font-black tracking-tighter text-blue-400 mb-2 uppercase">Eagle Wheel 🎡</h1>
    <p id="status" class="text-xs text-gray-400 mb-4 text-center">1er tour gratuit • Suivants: 1 $TALON</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="canvas" width="500" height="500"></canvas>
    </div>
        <div class="w-full max-w-xs space-y-3 mt-6">
        <button id="spinBtn" onclick="handleSpin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95 uppercase tracking-widest text-sm">
            Tenter ma chance 🚀
        </button>
        
        <div id="paymentNotice" class="hidden glass p-3 rounded-xl text-[10px] text-amber-500 text-center border border-amber-500/30">
            SOLDE GRATUIT ÉPUISÉ <br> Rejouer pour 1 $TALON ?
        </div>

        <button onclick="shareResult()" class="w-full bg-white/10 text-white/50 py-2 rounded-xl text-[10px] uppercase font-bold">
            Partager mon gain
        </button>
        </div>
            <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const sectors = ["JACKPOT 🦅", "PERDU 💀", "10 $TALON", "FREE SPIN", "PERDU 💀", "5 $TALON", "BONUS 🎁", "PERDU 💀"];
        const colors = ["#f59e0b", "#1e293b", "#3b82f6", "#10b981", "#1e293b", "#6366f1", "#ec4899", "#1e293b"];
        
        let freeSpinUsed = false;
        let isSpinning = false;
        let currentRotation = 0;

        function drawWheel() {
            const arc = (2 * Math.PI) / sectors.length;
            for (let i = 0; i < sectors.length; i++) {
                ctx.beginPath(); ctx.fillStyle = colors[i];
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, i * arc, (i + 1) * arc);
                ctx.fill();
                ctx.save(); ctx.translate(250, 250); ctx.rotate(i * arc + arc / 2);
                ctx.fillStyle = "white"; ctx.font = "bold 24px sans-serif";
                ctx.fillText(sectors[i], 100, 10); ctx.restore();
            }
        }

        async function handleSpin() {
            if (isSpinning) return;
            if (!freeSpinUsed) {
                startSpin(); freeSpinUsed = true;
                document.getElementById('paymentNotice').classList.remove('hidden');
                document.getElementById('status').innerText = "Tour gratuit utilisé !";
            } else {
                await payToPlay();
            }
        }

        async function payToPlay() {
            try {
                if (window.farcaster && window.farcaster.sdk) {
                    await window.farcaster.sdk.actions.eth_sendTransaction({
                        params: { 
                            to: "0x872b8348dF29fE38D331CBe9048a60424578fA83", 
                            value: "10000000000000000" // 1 $TALON (unité Base)
                        } 
                    });
                    startSpin();
                } else {
                    alert("Mode Test : Paiement de 1 $TALON simulé");
                    startSpin();
                }
            } catch (e) { console.error("Paiement annulé", e); }
        }

        function startSpin() {
            isSpinning = true;
            const extraDegrees = Math.floor(Math.random() * 360) + 1440; // 4 tours min
            currentRotation += extraDegrees;
            canvas.style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                isSpinning = false;
                document.getElementById('status').innerText = "Bravo ! Rejoue pour 1 $TALON";
            }, 4000);
        }

        function shareResult() {
            const text = encodeURIComponent("J'ai fait tourner la TALON Wheel ! 🎡 Viens tenter ta chance sur l'Arcade : @eagle-pi");
            const shareUrl = `https://warpcast.com/~/compose?text=${text}&embeds[]=${window.location.href}`;
            if (window.farcaster?.sdk) window.farcaster.sdk.actions.openUrl(shareUrl);
            else window.open(shareUrl, '_blank');
        }

        async function init() {
            try { if (window.farcaster?.sdk) await window.farcaster.sdk.actions.ready(); } catch(e) {}
            drawWheel();
        }
        init();
    </script>
</body>
</html>
